{% extends 'base.html' %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <!-- Admin Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block bg-dark sidebar">
            <div class="position-sticky pt-3">
                <div class="text-center mb-4">
                    <h5 class="text-white"><i class="fas fa-cog"></i> Admin Panel</h5>
                    <small class="text-light">{{ user.get_full_name|default:user.username }}</small>
                </div>

                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'accounts:admin_dashboard' %}">
                            <i class="fas fa-tachometer-alt"></i>
                            Dashboard
                        </a>
                    </li>
                    
                    <li class="nav-divider my-3 border-top"></li>
                    
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'accounts:admin_user_list' %}">
                            <i class="fas fa-users"></i>
                            Users
                        </a>
                    </li>
                    
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'accounts:course_list' %}">
                            <i class="fas fa-book"></i>
                            Courses
                        </a>
                    </li>
                    
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'accounts:admin_lesson_list_all' %}">
                            <i class="fas fa-file-alt"></i>
                            Lessons
                        </a>
                    </li>
                    
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'accounts:admin_assignment_list_all' %}">
                            <i class="fas fa-tasks"></i>
                            Assignments
                        </a>
                    </li>
                    
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'accounts:admin_exam_list_all' %}">
                            <i class="fas fa-edit"></i>
                            Exams
                        </a>
                    </li>
                    
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'accounts:admin_certificate_list' %}">
                            <i class="fas fa-certificate"></i>
                            Certificates
                        </a>
                    </li>

                    <li class="nav-divider my-3 border-top"></li>
                    
                    <li class="nav-item">
                        <a class="nav-link text-warning" href="{% url 'accounts:dashboard' %}">
                            <i class="fas fa-arrow-left"></i>
                            Back to User Dashboard
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            {% block admin_content %}{% endblock %}
        </main>
    </div>
</div>
{% endblock %}
