{% extends 'base.html' %}

{% block title %}Points System - CodeLab{% endblock %}

{% block content %}
<div class="container py-5">
    <h1 class="mb-4">Points System</h1>
    <p>Learn how to earn points in the CodeLab community:</p>

    <ul class="list-group">
        {% for rule in points_rules %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {{ rule.action }}
                <span class="badge bg-primary rounded-pill">{{ rule.points }} pts</span>
            </li>
        {% endfor %}
    </ul>

    <a href="{% url 'community_index' %}" class="btn btn-secondary mt-3">Back to Community</a>
</div>
{% endblock %}
